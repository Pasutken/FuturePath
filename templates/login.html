<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ - IT Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #21263a;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --accent: #00d4a0;
      --accent2: #00b386;
      --accent-glow: rgba(0,212,160,0.12);
      --text: #e8ecf0;
      --text-muted: #7a8394;
      --text-dim: #3d4557;
      --font: 'IBM Plex Sans Thai', sans-serif;
      --mono: 'Space Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 48px; height: 48px;
      background: var(--accent-glow);
      border: 1px solid rgba(0,212,160,0.3);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }

    .brand-icon svg { width: 24px; height: 24px; }

    .brand-name {
      font-size: 24px; font-weight: 600; letter-spacing: -0.5px;
    }

    .brand-name span { color: var(--accent); }

    .login-title {
      font-size: 18px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .google-btn {
      width: 100%;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      text-decoration: none;
      margin-bottom: 24px;
    }

    .google-btn:hover {
      background: #3367d6;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    }

    .google-btn svg {
      width: 20px; height: 20px;
    }

    .divider {
      position: relative;
      margin: 24px 0;
      text-align: center;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      position: relative;
      background: var(--surface);
      padding: 0 16px;
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .info {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="13" rx="3.5" stroke="#00d4a0" stroke-width="1.5"/>
          <circle cx="8.5" cy="10.5" r="1.5" fill="#00d4a0"/>
          <circle cx="15.5" cy="10.5" r="1.5" fill="#00d4a0"/>
          <path d="M12 20v-3" stroke="#00d4a0" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M8 20h8" stroke="#00d4a0" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">IT<span>Bot</span></span>
    </div>

    <h1 class="login-title">เข้าสู่ระบบ</h1>
    <p class="login-subtitle">เข้าสู่ระบบด้วยบัญชี Google ของคุณ</p>

    {% if request.args.get('error') %}
    <div class="error">
      เกิดข้อผิดพลาดในการเข้าสู่ระบบ กรุณาลองใหม่อีกครั้ง
    </div>
    {% endif %}

    <a href="{{ url_for('google_login') }}" class="google-btn">
      <svg viewBox="0 0 24 24">
        <path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#ffffff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#ffffff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#ffffff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      เข้าสู่ระบบด้วย Google
    </a>

    <div class="divider">
      <span>หรือ</span>
    </div>

    <div class="info">
      การเข้าสู่ระบบนี้ใช้ OAuth 2.0 ของ Google<br>
      ข้อมูลของคุณจะถูกเก็บไว้อย่างปลอดภัย
    </div>
  </div>
</body>
</html>
